[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["live: hits the real OpenRouter API; skipped when OPENROUTER_API_KEY is not set"]
